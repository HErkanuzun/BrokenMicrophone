name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android uygulaması. Yayın anahtarı gizli değişkenlerde (ANDROID_KEYSTORE base64, ANDROID_KEYSTORE_PASS).
      # Anahtar yoksa: etiketli yayında APK atlanır, diğer derlemelerde deneme anahtarıyla imzalanır.
      - name: Build Android app
        shell: pwsh
        env:
          BM_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          BM_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if (-not $env:BM_KEYSTORE -and '${{ github.ref }}'.StartsWith('refs/tags/v')) {
            Write-Warning 'ANDROID_KEYSTORE secret is missing: release without the APK.'
            exit 0
          }
          ./android/build.ps1

      - name: Build
        shell: cmd
        run: build.bat ci

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Kod imzalama (SignPath Foundation). Sadece v* etiketinde ve depo ayarlarında
      # SIGNPATH_* değerleri girildiyse çalışır; her istek SignPath'te elle onaylanır.
      - name: Upload unsigned program
        id: unsigned-program
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-program
          path: bin/BrokenMicrophone.exe

      - name: Sign program
        if: steps.unsigned-program.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-program.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: bin

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/package.ps1 -Version ("${{ github.ref_name }}".TrimStart('v'))

      - name: Upload unsigned setup
        id: unsigned-setup
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_PROJECT_SLUG != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist/BrokenMicrophone-*-Setup.exe

      - name: Sign setup
        if: steps.unsigned-setup.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - name: Update checksums
        if: steps.unsigned-setup.outcome == 'success'
        shell: pwsh
        run: |
          # imzalanan kurulum dosyasının özeti değişti
          $sums = foreach ($f in Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name) {
            "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($f.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'dist/SHA256SUMS.txt'), [string[]]$sums)
          $sums

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrokenMicrophone
          path: |
            bin/BrokenMicrophone.exe
            bin/BrokenMicrophone.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          append_body: true
          body: |
            [Code signing policy](https://github.com/HErkanuzun/BrokenMicrophone/blob/main/SECURITY.md#code-signing-policy)
          files: |
            dist/BrokenMicrophone-*-Setup.exe
            dist/BrokenMicrophone-*-Portable.zip
            dist/BrokenMicrophone.apk
            dist/SHA256SUMS.txt
